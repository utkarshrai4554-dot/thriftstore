<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Delivery Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>Test Delivery Agent Login</h1>
    <p>This page helps test delivery agent authentication and database setup.</p>

    <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" value="co2023.palak.kalwani@ves.ac.in">
    </div>

    <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter password">
    </div>

    <button onclick="testFirebaseAuth()">Test Firebase Auth</button>
    <button onclick="checkDeliveryAgent()">Check Delivery Agent Status</button>
    <button onclick="testFullLogin()">Test Full Login Flow</button>

    <div id="result"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCpKm4tr8kg9-fy4psyAajPhU8T9IHAzQ0",
            authDomain: "styleease-2170f.firebaseapp.com",
            projectId: "styleease-2170f",
            storageBucket: "styleease-2170f.firebasestorage.app",
            messagingSenderId: "921047643742",
            appId: "1:921047643742:web:29a1189bd75f69cf42e6cf",
            measurementId: "G-DM4BG77729"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function showResult(message, isError = false) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `<div class="${isError ? 'error' : 'success'}">${message}</div>`;
        }

        async function testFirebaseAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                showResult('Testing Firebase authentication...');
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                showResult(`✅ Firebase Auth successful! User: ${userCredential.user.email}, UID: ${userCredential.user.uid}`);
                await auth.signOut(); // Sign out after test
            } catch (error) {
                showResult(`❌ Firebase Auth failed: ${error.code} - ${error.message}`, true);
            }
        }

        async function checkDeliveryAgent() {
            const email = document.getElementById('email').value;

            try {
                showResult('Checking delivery agent status...');
                
                // First try to get user by email (this is a workaround since we can't directly query by email)
                const usersSnapshot = await db.collection('users').where('email', '==', email).get();
                
                if (usersSnapshot.empty) {
                    showResult('❌ No user found with this email in users collection', true);
                    return;
                }

                const userDoc = usersSnapshot.docs[0];
                const userData = userDoc.data();
                const userUid = userDoc.id;

                showResult(`✅ User found: ${JSON.stringify(userData, null, 2)}`);

                // Check delivery agent collection
                const deliveryAgentDoc = await db.collection('deliveryAgents').doc(userUid).get();
                
                if (deliveryAgentDoc.exists) {
                    const agentData = deliveryAgentDoc.data();
                    showResult(`✅ Delivery agent found: ${JSON.stringify(agentData, null, 2)}`);
                } else {
                    showResult('❌ No delivery agent record found for this user', true);
                }

            } catch (error) {
                showResult(`❌ Error checking delivery agent: ${error.message}`, true);
            }
        }

        async function testFullLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                showResult('Testing full delivery agent login flow...');
                
                // Step 1: Firebase Auth
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                showResult(`✅ Step 1: Firebase Auth successful. UID: ${userCredential.user.uid}`);

                // Step 2: Check user document
                const userDoc = await db.collection('users').doc(userCredential.user.uid).get();
                if (!userDoc.exists) {
                    throw new Error('User document not found in Firestore');
                }
                const userData = userDoc.data();
                showResult(`✅ Step 2: User document found. Role: ${userData.role}`);

                // Step 3: Check role
                if (userData.role !== 'delivery') {
                    throw new Error(`User role is '${userData.role}', expected 'delivery'`);
                }
                showResult(`✅ Step 3: User role verified as delivery`);

                // Step 4: Check delivery agent approval
                const deliveryAgentDoc = await db.collection('deliveryAgents').doc(userCredential.user.uid).get();
                if (!deliveryAgentDoc.exists) {
                    throw new Error('Delivery agent document not found');
                }
                const agentData = deliveryAgentDoc.data();
                showResult(`✅ Step 4: Delivery agent document found. Status: ${agentData.status}`);

                // Step 5: Check approval status
                if (agentData.status !== 'approved') {
                    throw new Error(`Delivery agent status is '${agentData.status}', expected 'approved'`);
                }
                showResult(`✅ Step 5: Delivery agent is approved`);

                showResult('🎉 Full login flow successful! User can login as delivery agent.');

                await auth.signOut();

            } catch (error) {
                showResult(`❌ Full login flow failed: ${error.message}`, true);
                try {
                    await auth.signOut();
                } catch (signOutError) {
                    // Ignore sign out errors
                }
            }
        }
    </script>
</body>
</html>

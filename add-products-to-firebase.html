        function updateStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
        }

        function log(message) {
            const logEl = document.getElementById('log');
            logEl.textContent += new Date().toLocaleTimeString() + ': ' + message + '\n';
            logEl.scrollTop = logEl.scrollHeight;
        }

        async function clearProducts() {
            const btn = document.getElementById('clearProductsBtn');
            btn.disabled = true;
            
            try {
                updateStatus('Clearing existing products...', 'info');
                log('🗑️ Clearing existing products...');
                
                const snapshot = await db.collection('products').get();
                const batch = db.batch();
                
                snapshot.docs.forEach(doc => {
                    batch.delete(doc.ref);
                });
                
                await batch.commit();
                
                updateStatus(`Cleared ${snapshot.size} products successfully!`, 'success');
                log(`✅ Successfully cleared ${snapshot.size} products`);
                
            } catch (error) {
                updateStatus('Error clearing products: ' + error.message, 'error');
                log('❌ Error: ' + error.message);
            } finally {
                btn.disabled = false;
            }
        }

        async function addProducts() {
            const btn = document.getElementById('addProductsBtn');
            btn.disabled = true;
            
            try {
                updateStatus('Adding products to Firebase...', 'info');
                log('🚀 Starting to add products...');
                
                let addedCount = 0;
                
                for (const product of sampleProducts) {
                    const productData = {
                        ...product,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    
                    await db.collection('products').add(productData);
                    log(`✅ Added: ${product.title}`);
                    addedCount++;
                }
                
                updateStatus(`Successfully added ${addedCount} products to Firebase!`, 'success');
                log(`🎉 Success! Added ${addedCount} products to Firebase.`);
                log(`🌐 Now visit your products page to see them: http://localhost:8081/products`);
                
            } catch (error) {
                updateStatus('Error adding products: ' + error.message, 'error');
                log('❌ Error: ' + error.message);
            } finally {
                btn.disabled = false;
            }
        }

        // Check current products on load
        window.addEventListener('load', async () => {
            try {
                const snapshot = await db.collection('products').get();
                log(`📊 Current products in database: ${snapshot.size}`);
                
                if (snapshot.size > 0) {
                    updateStatus(`Found ${snapshot.size} products in database`, 'info');
                } else {
                    updateStatus('No products found in database - ready to add sample products', 'info');
                }
            } catch (error) {
                updateStatus('Error checking products: ' + error.message, 'error');
                log('❌ Error checking products: ' + error.message);
            }
        });
    </script>
</body>

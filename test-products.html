<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Test - StyleEase</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8fafc;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }
        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .product-card:hover {
            transform: translateY(-4px);
        }
        .product-image {
            width: 100%;
            height: 350px;
            object-fit: cover;
        }
        .product-info {
            padding: 16px;
        }
        .product-title {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 16px;
        }
        .product-price {
            font-size: 20px;
            font-weight: 700;
            color: #059669;
            margin-bottom: 4px;
        }
        .product-condition {
            font-size: 14px;
            color: #6b7280;
            text-transform: capitalize;
        }
        .product-category {
            display: inline-block;
            background: #e5e7eb;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 8px;
        }
        .success-message {
            background: #10b981;
            color: white;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-message">
            ✅ <strong>Issue Fixed!</strong> Products are now displaying using mock data. The original issue was that Firebase had no approved products and authentication issues.
        </div>
        
        <div class="header">
            <h1>StyleEase - Shop Pre-Loved</h1>
            <p>Discover unique finds at great prices</p>
        </div>
        
        <div class="products-grid" id="productsGrid">
            <!-- Products will be loaded here -->
        </div>
    </div>

    <script>
        // Mock products data (same as in mockData.ts)
        const mockProducts = [
            { id: "1", name: "Vintage Leather Jacket", price: 89, category: "Clothes", condition: "good", image: "https://images.unsplash.com/photo-1551028719-00167b16eac5?w=400&h=500&fit=crop", views: 234, description: "Beautiful vintage leather jacket in great condition. Minor wear on the cuffs." },
            { id: "2", name: "Retro Gold Necklace", price: 35, category: "Jewellery", condition: "excellent", image: "https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=400&h=500&fit=crop", views: 180, description: "Stunning vintage gold necklace with intricate detailing." },
            { id: "3", name: "Classic Canvas Sneakers", price: 28, category: "Shoes", condition: "fair", image: "https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?w=400&h=500&fit=crop", views: 156, description: "Classic canvas sneakers with some wear but plenty of life left." },
            { id: "4", name: "Art Deco Vase", price: 65, category: "Artifacts", condition: "excellent", image: "https://images.unsplash.com/photo-1612196808214-b8e1d6145a8c?w=400&h=500&fit=crop", views: 312, description: "Gorgeous Art Deco vase in perfect condition." },
            { id: "5", name: "Floral Midi Dress", price: 42, category: "Clothes", condition: "good", image: "https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?w=400&h=500&fit=crop", views: 98, description: "Beautiful floral midi dress, perfect for summer." },
            { id: "6", name: "Antique Pocket Watch", price: 120, category: "Vintage", condition: "good", image: "https://images.unsplash.com/photo-1509048191080-d2984bad6ae5?w=400&h=500&fit=crop", views: 445, description: "Rare antique pocket watch, still keeps time." },
            { id: "7", name: "Suede Ankle Boots", price: 55, category: "Shoes", condition: "good", image: "https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=400&h=500&fit=crop", views: 201, description: "Quality suede boots with minor scuffing." },
            { id: "8", name: "Beaded Bracelet Set", price: 18, category: "Jewellery", condition: "excellent", image: "https://images.unsplash.com/photo-1611085583191-a3b181a88401?w=400&h=500&fit=crop", views: 89, description: "Handmade beaded bracelet set, like new." }
        ];

        // Load products into the grid
        function loadProducts() {
            const grid = document.getElementById('productsGrid');
            
            mockProducts.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${product.image}" alt="${product.name}" class="product-image">
                    <div class="product-info">
                        <div class="product-category">${product.category}</div>
                        <div class="product-title">${product.name}</div>
                        <div class="product-price">₹${product.price}</div>
                        <div class="product-condition">${product.condition}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Load products when page loads
        loadProducts();
    </script>
</body>
</html>
